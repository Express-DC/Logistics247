<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>247EXPRESS -DELIVERY SERVICE</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    background-size: 400% 400%;
    animation: gradientMove 8s ease infinite;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    color: #fff;
    text-align: center;
    padding: 20px;
  }

  .card {
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(16px);
    border: 2px solid rgba(255, 235, 59, 0.3);
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 600px;
    box-shadow: 0 0 40px rgba(255, 235, 59, 0.2);
    animation: popIn 0.7s ease;
  }

  .icon {
    font-size: 70px;
    margin-bottom: 15px;
    animation: bounce 1.5s infinite;
  }

  h1 {
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 16px;
    font-weight: 900;
    background: linear-gradient(90deg, #00ff88, #ffeb3b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  p {
    font-size: clamp(15px, 3.5vw, 18px);
    line-height: 1.7;
    color: #f1f1f1;
    margin: 0;
    font-weight: 500;
  }

  p .highlight {
    color: #ffeb3b;
    font-weight: 800;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️🧑‍🏭👷🚧</div>
    <h1>We Apologize For Inconvenience</h1>
    <p>
      The SITE IS UNDERGOING SOME MAINTENANCE AND UPGRADE,kindly bear with us as our engineers are working on it. 
      <br><br>
      <span class="highlight">Thank you for Choosing 247 Express Delivery Company, 
      <span class="highlight">We value you and your satisfaction is our priority</span> 🙏
      <br><br>
      BE RIGHT BACK SHORTLY 
    </p>
  </div>
</body>
</html>
